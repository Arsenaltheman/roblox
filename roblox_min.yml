---
# Minimal Roblox standard library for selene.
# selene's generated "roblox" std needs a network download that this build
# environment can't make, so Roblox globals are declared here as `any`.
base: luau
name: roblox_min
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  shared: { any: true }
  settings: { any: true }
  UserSettings: { any: true }
  task: { any: true }
  tick: { any: true }
  time: { any: true }
  elapsedTime: { any: true }
  warn: { any: true }
  typeof: { any: true }
  buffer: { any: true }
  vector: { any: true }
  stats: { any: true }
  version: { any: true }
  Enum: { any: true }
  Instance: { any: true }
  Axes: { any: true }
  BrickColor: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  Content: { any: true }
  DateTime: { any: true }
  Faces: { any: true }
  Font: { any: true }
  NumberRange: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  OverlapParams: { any: true }
  Path2DControlPoint: { any: true }
  PhysicalProperties: { any: true }
  Random: { any: true }
  Ray: { any: true }
  RaycastParams: { any: true }
  Rect: { any: true }
  Region3: { any: true }
  Region3int16: { any: true }
  SharedTable: { any: true }
  TweenInfo: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Vector2: { any: true }
  Vector2int16: { any: true }
  Vector3: { any: true }
  Vector3int16: { any: true }
